[project]
name = "dory"
version = "0.1.0"
description = "Design of Orbital Hamiltonians for You (tight-binding solver)"
authors = [
    { name="Sarinle Yusuf" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"